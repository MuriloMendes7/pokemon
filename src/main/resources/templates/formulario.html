<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cadastrar Novo Pokémon</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
<div class="container">
    <h1 class="mt-5">Novo Pokémon</h1>
    <form th:action="${acao} == null ? '/pokemon' : ${acao}" method="post">
        <div class="mb-3">
            <label for="nome" class="form-label">Nome</label>
            <input type="text" class="form-control" id="nome" name="nome" th:value="${acao} != null ? ${pokemon.nome}" required>
        </div>
        <div class="mb-3">
            <label for="altura" class="form-label">Altura (m)</label>
            <input type="number" class="form-control" id="altura" name="altura" step="0.01" th:value="${acao} != null ? ${pokemon.altura}" required>
        </div>
        <div class="mb-3">
            <label for="peso" class="form-label">Peso (kg)</label>
            <input type="number" class="form-control" id="peso" name="peso" step="0.01" th:value="${acao} != null ? ${pokemon.peso}" required>
        </div>
        <div class="mb-3">
            <label for="categoria" class="form-label">Categoria</label>
            <input type="text" class="form-control" id="categoria" name="categoria" th:value="${acao} != null ? ${pokemon.categoria}" required>
        </div>
        <div class="mb-3">
            <label for="dataDaCaptura" class="form-label">Data da Captura</label>
            <input type="date" class="form-control" id="dataDaCaptura" name="dataDaCaptura" th:value="${acao} != null ? ${pokemon.dataDaCaptura}" required>
        </div>
        <div class="mb-3">
            <label for="urlImagem" class="form-label">URL da Imagem</label>
            <input type="url" class="form-control" id="urlImagem" name="urlImagem" th:value="${acao} != null ? ${pokemon.urlImagem}">
        </div>
        <button type="submit" class="btn btn-success">Salvar</button>
        <a href="/pokemon" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
</body>
</html>
