<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Pokémons</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body>
<div class="container">
    <h1 class="mt-5">Lista de Pokémons</h1>

    <a href="/pokemon/novo" class="btn btn-primary mb-3">Cadastrar Novo Pokémon</a>

    <table class="table table-striped mt-3">
        <thead>
        <tr>
            <th>Código</th>
            <th>Nome</th>
            <th>Altura</th>
            <th>Peso</th>
            <th>Categoria</th>
            <th>Data da Captura</th>
            <th>Imagem</th>
            <th>Ações</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="pokemon : ${pokemons}">
            <td th:text="${pokemon.codigo}"></td>
            <td th:text="${pokemon.nome}"></td>
            <td th:text="${#numbers.formatDecimal(pokemon.altura, 1, 'POINT', 2, 'COMMA')} + ' m'"></td>
            <td th:text="${#numbers.formatDecimal(pokemon.peso, 1, 'POINT', 2, 'COMMA')} + ' kg'"></td>
            <td th:text="${pokemon.categoria}"></td>
            <td th:text="${#temporals.format(pokemon.dataDaCaptura, 'dd/MM/yyyy')}"></td>
            <td>
                <img th:src="${pokemon.urlImagem}" alt="Imagem do Pokémon"
                     style="width: 50px; height: auto;">
            </td>
            <td>
                <!-- Link para editar o pokémon -->
                <a th:href="@{/pokemon/editar/{id}(id=${pokemon.codigo})}"
                   class="btn btn-warning btn-sm me-1">
                    <i class="bi bi-pencil-square"></i> Editar
                </a>
                <!-- Link para excluir o pokémon -->
                <a th:href="@{/pokemon/excluir/{id}(id=${pokemon.codigo})}"
                   class="btn btn-danger btn-sm" onclick="return confirm('Você tem certeza que deseja excluir?');">
                    <i class="bi bi-trash"></i> Excluir
                </a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
